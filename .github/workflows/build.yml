name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build VST3
        run: |
          msbuild Builds/VisualStudio2022/CognitoniBlkFx.sln /p:Configuration=Release /p:Platform=x64
      - name: Build installer
        run: |
          iscc installer/win/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BlkFx-Win
          path: Builds/BlkFx_Win_Installer*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build VST3
        run: |
          xcodebuild -project Builds/MacOSX/CognitoniBlkFx.xcodeproj -configuration Release
      - name: Create DMG
        run: |
          chmod +x installer/mac/create-dmg.sh
          ./installer/mac/create-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlkFx-macOS
          path: Builds/BlkFx_macOS.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlkFx-Win
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: BlkFx-macOS
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
