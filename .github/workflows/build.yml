name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --parallel 4
      - name: Build installer
        run: iscc installer/win/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BlkFx-Win
          path: Builds/BlkFx_Win_Installer*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VST3
        run: |
          cmake -B build
          cmake --build build --config Release --parallel 3
      - name: Create DMG
        run: |
          chmod +x installer/mac/create-dmg.sh
          ./installer/mac/create-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlkFx-macOS
          path: Builds/BlkFx_macOS.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlkFx-Win
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: BlkFx-macOS
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
